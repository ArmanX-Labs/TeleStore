[package]
name = "mycloud"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
grammers-client = "0.10.0"
grammers-mtsender = "0.10.0"
grammers-session = "0.10.0"
reqwest = { version = "0.13.5", features = ["multipart", "json"] }
rusqlite = { version = "0.33.0", package = "libsql-rusqlite" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "1", features = ["api-all"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
tauri-build = "1.5"
